name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  notebooks:
    name: Execute notebooks (nbconvert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute into a scratch directory so the committed notebooks are not
      # modified. This proves every notebook runs end to end on a clean machine,
      # which is the reproducibility claim the repository makes.
      - name: Execute all notebooks
        run: |
          set -euo pipefail
          mkdir -p /tmp/executed
          failed=0
          for nb in notebooks/*.ipynb; do
            name="$(basename "$nb")"
            echo "::group::executing $name"
            if jupyter nbconvert --to notebook --execute \
                 --output-dir /tmp/executed \
                 --ExecutePreprocessor.timeout=600 "$nb"; then
              echo "OK $name"
            else
              echo "::error::failed to execute $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Verify executed notebooks produced output
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = []
          for path in sorted(glob.glob("/tmp/executed/*.ipynb")):
              nb = json.load(open(path))
              code = [c for c in nb["cells"] if c["cell_type"] == "code"]
              if not any(c.get("outputs") for c in code):
                  bad.append(path)
          if bad:
              print("notebooks produced no output:", bad)
              sys.exit(1)
          print("all executed notebooks produced output")
          PY

  reports:
    name: Reports are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Confirm the generator can still produce every report from the live
      # published datasets. This deliberately does NOT require byte-equality with
      # the committed files: the upstream dataset updates on its own schedule, so
      # a diff here would fail CI for a reason unrelated to this repository.
      # Keeping committed reports current is sync-and-report.yml's job.
      - name: Generate reports against live data (dry run)
        run: python scripts/generate_reports.py --check

      # The committed reports themselves must be structurally valid and current
      # as of the last sync.
      - name: Validate committed reports
        run: python scripts/validate_reports.py
